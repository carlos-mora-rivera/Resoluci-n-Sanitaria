<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redireccionando - Resolución Sanitaria</title>

    <!-- Vincular el archivo CSS externo -->
    <link rel="stylesheet" href="styles.css">

    <!-- Redirección meta limpia a los 3 segundos -->
    <meta http-equiv="refresh" content="3;url=https://www.minsal.cl/reglamento-de-la-ley-de-etiquetado-de-alimentos-descarga/">
</head>
<body>

    <main class="card">
        <!-- Encabezado / Marca -->
        <div class="brand">
            <span class="brand-icon">🍯</span>
            <span class="brand-text">Agrupación de Apicultores</span>
        </div>

        <!-- Título principal -->
        <h1 class="title">Resolución Sanitaria</h1>

        <!-- Área de animación -->
        <div class="redirect-box">
            <div class="bee-track">
                <span class="bee">🐝</span>
            </div>
            <div class="redirect-text">
                Redireccionando<span class="dots"><span>.</span><span>.</span><span>.</span></span>
            </div>
        </div>

        <!-- Descripción -->
        <p class="description">
            Te estamos derivando al documento oficial de la resolución sanitaria del MINSAL.
        </p>

        <!-- Barra de progreso visual -->
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <!-- Enlace manual por si falla la redirección -->
        <div class="manual-fallback">
            ¿No fuiste redirigido automáticamente?<br>
            <a id="redirect-link" href="https://www.minsal.cl/reglamento-de-la-ley-de-etiquetado-de-alimentos-descarga/" rel="noopener noreferrer">Haz clic aquí para ingresar</a>
        </div>
    </main>

    <!-- Script de redirección mejorado -->
    <script>
        const TARGET_URL = "https://www.minsal.cl/reglamento-de-la-ley-de-etiquetado-de-alimentos-descarga/";

        // Redirección forzada sustituyendo la ventana actual
        setTimeout(function() {
            window.location.replace(TARGET_URL);
        }, 3000);
    </script>

</body>
</html>
